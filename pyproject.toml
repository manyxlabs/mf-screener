[project]
name = "mf-screener"
version = "0.1.0"
description = "Local-first Indian mutual fund screener: ingestion, analytics and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mf-analytics",
  "mf-api",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-pyyaml>=6.0",
]

[tool.uv.sources]
mf-analytics = { workspace = true }
mf-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/analytics", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/analytics/src", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["mf_analytics", "mf_api"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:mf_analytics.*"]

[tool.ruff.lint.per-file-ignores]
# These three files are tables of prose and LaTeX: metric definitions, missing-data
# explanations and rendered formulas. Wrapping the strings hurts them more than the
# long lines do.
"apps/api/mf_api/columns.py" = ["E501"]
"apps/api/mf_api/methodology.py" = ["E501"]
"packages/analytics/src/mf_analytics/quality.py" = ["E501"]
