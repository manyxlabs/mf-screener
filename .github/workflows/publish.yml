# Rebuilds the store from AMFI every night and publishes the static site to GitHub Pages.
# A push republishes from the newest nightly export without rebuilding it, so any code
# change goes live in minutes; what the export itself contains changes with the next
# nightly run, or at once from a manual run with "rebuild" ticked.
name: Publish

on:
  schedule:
    # 02:00 IST, after AMFI has published the day's NAVs.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the data from AMFI first (about two hours)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# One group per kind: GitHub keeps a single pending run per group, so a shared group
# would let a queued push cancel a queued nightly rebuild.
concurrency:
  group: publish-${{ github.event_name == 'push' && 'push' || 'data' }}
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name == 'schedule' || inputs.rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prepare
        run: |
          cp .env.example .env
          uv sync --frozen
          uv run python -m mf_analytics.cli init
      - name: Rebuild the store from AMFI
        run: make data-site
      - name: Export the static data
        run: make static-export OUT=apps/web/public/data
      - uses: actions/cache/save@v4
        with:
          path: apps/web/public/data
          key: static-data-${{ github.run_id }}

  site:
    needs: data
    # Runs after a rebuild, and on its own when the data job is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The newest export, whichever code wrote it. Nothing pairs it with this commit's
      # code by hash any more: the E2E suite below drives every page over this very
      # data, so web code that cannot read it fails here instead of in a browser.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/public/data
          key: static-data-none
          restore-keys: static-data-
          fail-on-cache-miss: true
      - name: Refuse stale data
        # Schedules stop after 60 days without repository activity, and nothing else
        # would notice: the site would keep serving old NAVs with every run green.
        run: |
          latest=$(jq -r .coverage.latest_nav_date apps/web/public/data/global/metadata.json)
          age=$(( ($(date -u +%s) - $(date -u -d "$latest" +%s)) / 86400 ))
          echo "Latest NAV $latest, $age days old"
          test "$age" -le 5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mf/web exec playwright install --with-deps chromium
      # The portfolio suite encrypts its synthetic statement with qpdf; without it the
      # password test is skipped, and a skipped test proves nothing.
      - run: sudo apt-get install -y --no-install-recommends qpdf
      - name: Build the static site and test it end to end
        # The suite's web server runs `npm run build`, so `out` is what it tested.
        run: make e2e PNPM=pnpm
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: apps/web/test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: site
    # GitHub skips a job whose upstream was skipped unless told otherwise, and on a
    # push the data job always is.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Every fund page changes with each NAV refresh, so every URL is submitted. The key is
      # public by design (apps/web/public/<key>.txt): it proves only that we control the host.
      - name: Submit every sitemap URL to IndexNow
        env:
          SITE: https://screener.manyxlabs.com
          KEY: 050c05e22cf3fe16ec2cd3492a8654ae
        run: |
          curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          # IndexNow takes at most 10,000 URLs per request.
          split -l 10000 urls.txt batch-
          for batch in batch-*; do
            jq -Rn --arg key "$KEY" --arg site "$SITE" \
              '{host: ($site | sub("^https://"; "")), key: $key, urlList: [inputs]}' < "$batch" \
              | curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
                  -H 'Content-Type: application/json; charset=utf-8' --data @- -w '%{http_code}\n'
          done
          echo "Submitted $(wc -l < urls.txt) URLs"
