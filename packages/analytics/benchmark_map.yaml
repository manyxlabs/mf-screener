# Sub-category -> benchmark mapping. Matching is case-insensitive "contains".
# The first rule that matches wins.
#
# Each of sub_category_contains and scheme_name_contains is an OR of substrings.
# `match` says how the two combine and defaults to "any"; "all" requires both, which
# is what the sectoral rules below need.
#
# A scheme maps to `benchmark_id` if that series is loaded, else to the first loaded
# entry in fallback_benchmark_ids, else it stays unmapped (metrics report
# "benchmark_not_mapped" rather than silently using a wrong index).
version: 2
mappings:
  # --- Sectoral and thematic. These come first because a Nifty Bank index fund is
  # filed under "Index Funds" and would otherwise be swept up by the coarse Nifty 50
  # rule at the bottom.
  #
  # Every one of them is match: all, and the name tokens are deliberately multi-word.
  # "bank" alone is not a sector: BANK OF INDIA is an AMC, and matching it would
  # benchmark that house's liquid, arbitrage and ELSS funds against Nifty Bank.
  # The sub-category gate is what keeps "Banking and PSU Debt Fund" - 119 active debt
  # schemes - out of an equity index entirely.
  #
  # No fallback_benchmark_ids on any of these: a sector fund measured against the
  # broad market reports its sector's excess return as alpha, which is worse than
  # reporting no alpha. Unmapped is the honest answer when the sector series is absent.
  - match: all
    sub_category_contains:
      ["Sectoral", "Thematic", "Index Fund", "Equity ETF", "Equity Funds", "Other ETF"]
    scheme_name_contains:
      [
        "nifty bank",
        "psu bank",
        "bank index",
        "bank etf",
        "banking and financial",
        "banking & financial",
        "financial services",
      ]
    scheme_name_excludes: &debt_tokens
      [
        "debt",
        "bond",
        "gilt",
        "g-sec",
        "gsec",
        "sdl",
        "liquid",
        "overnight",
        "money market",
        "arbitrage",
        "psu debt",
        "duration",
        "maturity",
        "crisil-ibx",
        "nifty sdl",
      ]
    benchmark_id: NIFTY_BANK_PROXY
    notes: Banking and financial-services mandates. Index-fund proxy, so it understates the index.
  - match: all
    sub_category_contains:
      ["Sectoral", "Thematic", "Index Fund", "Equity ETF", "Equity Funds", "Other ETF"]
    scheme_name_contains: ["nifty it", "it index", "it etf", "technology", "digital"]
    scheme_name_excludes: *debt_tokens
    benchmark_id: NIFTY_IT_PROXY
    notes: Technology mandates. "it" is only ever matched as part of a longer token.
  - match: all
    sub_category_contains:
      ["Sectoral", "Thematic", "Index Fund", "Equity ETF", "Equity Funds", "Other ETF"]
    scheme_name_contains: ["pharma", "healthcare", "health care"]
    scheme_name_excludes: *debt_tokens
    benchmark_id: NIFTY_PHARMA_PROXY
    notes: Pharma and healthcare mandates.

  - sub_category_contains: ["Large Cap"]
    benchmark_id: NIFTY50_TRI
    notes: SEBI large-cap mandate; Nifty 50 TRI is the common reference.
  - sub_category_contains: ["Mid Cap"]
    benchmark_id: NIFTY_MIDCAP150_TRI
    fallback_benchmark_ids: [NIFTY500_TRI]
  - sub_category_contains: ["Small Cap"]
    benchmark_id: NIFTY_SMALLCAP250_TRI
    fallback_benchmark_ids: [NIFTY500_TRI]
  - sub_category_contains: ["Flexi Cap", "Multi Cap", "Large & Mid Cap", "ELSS", "Focused"]
    benchmark_id: NIFTY500_TRI
  - sub_category_contains: ["Value", "Contra"]
    benchmark_id: NIFTY500_VALUE50_TRI
    fallback_benchmark_ids: [NIFTY500_TRI]
    notes: Value 50 TRI where loaded, otherwise the broad market.
  - scheme_name_contains: ["momentum"]
    benchmark_id: NIFTY500_MOMENTUM50_TRI
    fallback_benchmark_ids: [NIFTY500_TRI]
  - scheme_name_contains: ["s&p 500", "s and p 500"]
    benchmark_id: SP500_TR_INR
    fallback_benchmark_ids: [SP500_TR_USD]
    notes: >
      SP500_TR_USD is a USD series. It is never mixed with INR fund returns; if only
      the USD series is loaded the scheme is mapped to it and flagged currency_mismatch.
  - sub_category_contains: ["Index Funds", "Index Fund"]
    benchmark_id: NIFTY50_TRI
    fallback_benchmark_ids: [NIFTY500_TRI]
    notes: Coarse - an index fund tracking something other than the Nifty 50 is mapped only as a fallback.
