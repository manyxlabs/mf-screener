[project]
name = "mf-analytics"
version = "0.1.0"
description = "Analytics, ingestion and canonical data model for the Indian MF screener"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.9",
]

[project.scripts]
mf-data = "mf_analytics.cli:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_analytics"]
artifacts = ["src/mf_analytics/py.typed"]
